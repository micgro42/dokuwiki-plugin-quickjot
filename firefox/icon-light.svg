     stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="7" width="30" height="50" rx="6"/>
    <path d="M14 25h14M14 39h14"/>
  </g>

  <path fill="#8ab4e8" d="M42 42 L55 29 l6 6 l-13 13 l-8 2 Z"/>
</svg>
