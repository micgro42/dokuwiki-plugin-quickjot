<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Light ink, for dark themes - "light" in manifest theme_icons means the theme uses
    light text, not a light background. Geometry is identical to icon.svg; only the two
    colours differ. No media query here: theme_icons has already done the choosing.
  -->
