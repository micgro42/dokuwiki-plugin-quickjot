<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Dark ink, for light themes. The light-ink twin is icon-light.svg; the manifest picks
    between them via action.theme_icons.

    Every colour here is a presentation attribute, deliberately. Firefox does not apply
    this file's <style> block when it rasterises the toolbar icon, so anything whose
    colour lives only in CSS renders with SVG defaults - stroked shapes vanish (default
    stroke is none) and filled ones turn black. The media query below is a bonus for the
    contexts that do honour it, never the thing that makes the icon visible.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f4f4f6; }
      .nib { fill: #8ab4e8; }
    }
  </style>

  <g class="ink" fill="none" stroke="#37373f" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="7" width="30" height="50" rx="6"/>
    <path d="M14 25h14M14 39h14"/>
  </g>

  <path class="nib" fill="#2b6cb0" d="M42 42 L55 29 l6 6 l-13 13 l-8 2 Z"/>
</svg>
